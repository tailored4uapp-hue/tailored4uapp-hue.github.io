<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tailored4U Appsの公式サイトです。">
  <title>Tailored4U Apps</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f5f7fb;
      color: #172033;
    }

    main {
      width: min(34rem, calc(100% - 3rem));
      padding: 3rem;
      border: 1px solid #dce2ed;
      border-radius: 1.5rem;
      background: #fff;
      box-shadow: 0 1rem 3rem rgb(32 48 80 / 10%);
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 8vw, 3.5rem);
    }

    p {
      margin: 0 0 2rem;
      color: #526078;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: .85rem 1.25rem;
      border-radius: .8rem;
      background: #2457d6;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      background: #1848bd;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #0e1420; color: #f3f6fc; }
      main { border-color: #2e394d; background: #171f2e; }
      p { color: #abb6ca; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Tailored4U Apps</h1>
    <p>毎日の暮らしに寄り添うアプリを提供しています。</p>
    <a href="/app-support/">アプリのサポートを見る</a>
  </main>
</body>
</html>
